<script type="text/html" data-template-name="dingtalk-send-image">
    <div class="form-row">
        <label for="node-input-config"><i class="fa fa-plug"></i> 连接</label>
        <input type="text" id="node-input-config">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="发送图片">
    </div>
    <div class="form-row">
        <label for="node-input-target"><i class="fa fa-crosshairs"></i> 发送到</label>
        <select id="node-input-target">
            <option value="auto">自动（有群 ID 发群，否则单聊）</option>
            <option value="group">群聊</option>
            <option value="single">单聊</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-conversationId"><i class="fa fa-users"></i> 群 ID</label>
        <input type="text" id="node-input-conversationId" list="dt-conv-list" placeholder="cidXXX==（可留空用 msg.conversationId）">
    </div>
    <div class="form-row">
        <label for="node-input-userIds"><i class="fa fa-user"></i> 接收人</label>
        <input type="text" id="node-input-userIds" list="dt-user-list" placeholder="userid，多个用逗号分隔（单聊用）">
    </div>
    <datalist id="dt-conv-list"></datalist>
    <datalist id="dt-user-list"></datalist>
    <div class="form-row">
        <label for="node-input-urlMode"><i class="fa fa-link"></i> URL 处理</label>
        <select id="node-input-urlMode">
            <option value="auto">自动（内网地址下载后上传，公网直传）</option>
            <option value="direct">总是直传 URL</option>
            <option value="upload">总是下载后上传</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-robotCode"><i class="fa fa-robot"></i> Robot Code</label>
        <input type="text" id="node-input-robotCode" placeholder="留空则用连接配置里的">
    </div>
    <div class="form-tips">
        <code>msg.payload</code> 支持：本地绝对路径（如 <code>/volume1/www/a.png</code>）、
        http(s) URL、<code>data:</code> base64、纯 base64、Buffer。
        本地文件会先上传换 mediaId，因为钉钉图片消息只认 URL 或 mediaId。
    </div>
</script>

<script type="text/html" data-help-name="dingtalk-send-image">
    <p>用机器人身份发送图片消息。</p>
    <h3>输入</h3>
    <ul>
        <li><code>msg.payload</code> — 本地路径 / http(s) URL / base64 / Buffer</li>
        <li><code>msg.filename</code> — 可选，上传时的文件名</li>
        <li><code>msg.conversationId</code> 或 <code>msg.userIds</code> — 目标</li>
    </ul>
    <h3>输出</h3>
    <p><code>msg.dingtalk = { ok, target, msgKey, mediaId, photoURL, source, result }</code></p>
    <h3>注意</h3>
    <ul>
        <li>图片格式：PNG / JPG / GIF / BMP / WebP，单张上限 20MB</li>
        <li><b>内网 URL 钉钉服务器取不到</b>，必须设成「总是下载后上传」或留「自动」</li>
        <li>mediaId 形如 <code>@lA...</code>，有效期约 3 个月，长期复用要自己缓存</li>
        <li>想要带说明文字，用「发送文本」+ 图片分两条发，或改用互动卡片</li>
    </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('dingtalk-send-image', {
        category: 'dingtalk',
        color: '#5AA9E6',
        defaults: {
            name: { value: '' },
            config: { type: 'dingtalk-robot', value: '' },
            target: { value: 'auto' },
            conversationId: { value: '' },
            userIds: { value: '' },
            urlMode: { value: 'auto' },
            robotCode: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-picture-o',
        label: function () {
            return this.name || '发送图片';
        },
        paletteLabel: '发送图片',
        oneditprepare: function () {
            if (window.dtalkFillIdLists) window.dtalkFillIdLists();
        }
    });
</script>
