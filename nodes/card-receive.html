<script type="text/html" data-template-name="dingtalk-card-receive">
    <div class="form-row">
        <label for="node-input-config"><i class="fa fa-plug"></i> 连接</label>
        <input type="text" id="node-input-config">
    </div>
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="卡片按钮点击">
    </div>
    <div class="form-row">
        <label>&nbsp;</label>
        <input type="checkbox" id="node-input-autoUpdate" style="display:inline-block;width:auto;vertical-align:top;">
        <label for="node-input-autoUpdate" style="width:auto;">点击后立即回写卡片</label>
    </div>
    <div class="form-row" id="node-input-cardParamTemplate-row">
        <label for="node-input-cardParamTemplate">回写变量</label>
        <textarea id="node-input-cardParamTemplate" rows="4" style="width:70%;font-family:monospace;"
                  placeholder='{"status":"已处理：{{actionId}}","operator":"{{userId}}"}'></textarea>
    </div>
    <div class="form-tips">
        回写变量必须是合法 JSON，key 与卡片模板里的变量名一致。<br>
        可用占位符：<code>{{outTrackId}}</code>、<code>{{actionId}}</code>、<code>{{actionParam}}</code>、
        <code>{{userId}}</code>，以及按钮 value 里的任意字段（如 <code>{{action}}</code>）。<br>
        <b>留空则点击后卡片保持原样</b>，由下游「更新卡片」节点决定怎么改 —— 这是更灵活的做法。
    </div>
</script>

<script type="text/html" data-help-name="dingtalk-card-receive">
    <p>接收互动卡片的按钮点击回调。节点会<b>立刻应答钉钉</b>，再把这笔点击送到下游。</p>
    <h3>输出</h3>
    <ul>
        <li><code>msg.payload</code> — 按钮的 actionId（或 params.action）</li>
        <li><code>msg.outTrackId</code> — 卡片实例 ID，接「更新卡片」节点要用</li>
        <li><code>msg.dingtalk.userId</code> — 点击人的 userId（<b>平台不校验谁能点，白名单要自己做</b>）</li>
        <li><code>msg.dingtalk.params</code> — 按钮 <code>value</code> 里的业务参数</li>
        <li><code>msg.dingtalk.raw</code> — 钉钉原始回调体</li>
    </ul>
    <h3>为什么默认不回写卡片</h3>
    <p>应答里带 <code>cardData</code> 时钉钉会用它<b>覆盖</b>卡片变量，只传一部分就会把其余字段清空。
    所以默认只回 outTrackId，卡片保持不动。</p>
    <h3>去重</h3>
    <p>同一个 messageId 在 5 分钟内只处理一次，钉钉重推不会让流程跑两遍。</p>
</script>

<script type="text/javascript">
    RED.nodes.registerType('dingtalk-card-receive', {
        category: 'dingtalk',
        color: '#4B8BF5',
        defaults: {
            name: { value: '' },
            config: { type: 'dingtalk-robot', value: '' },
            autoUpdate: { value: false },
            cardParamTemplate: { value: '' }
        },
        inputs: 0,
        outputs: 1,
        icon: 'font-awesome/fa-hand-pointer-o',
        label: function () {
            return this.name || '卡片点击';
        },
        paletteLabel: '接收卡片回调',
        oneditprepare: function () {
            var $row = $('#node-input-cardParamTemplate-row');
            function refresh() {
                if ($('#node-input-autoUpdate').prop('checked')) $row.show();
                else $row.hide();
            }
            $('#node-input-autoUpdate').on('change', refresh);
            refresh();
        }
    });
</script>
