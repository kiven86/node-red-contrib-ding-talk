<script type="text/html" data-template-name="dingTalk-send">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="钉钉通知">
    </div>
    <div class="form-row">
        <label for="node-input-token"><i class="fa fa-key"></i> Access Token</label>
        <input type="text" id="node-input-token" placeholder="webhook 里 access_token= 后面那段">
    </div>
    <div class="form-row">
        <label for="node-input-secret"><i class="fa fa-lock"></i> 加签 Secret</label>
        <input type="password" id="node-input-secret" placeholder="安全设置选「加签」时填，选自定义关键词则留空">
    </div>
    <div class="form-tips">
        群自定义机器人<b>只能发、不能收</b>：没有回调，也收不到卡片点击。
        需要交互请用「发送卡片」+「接收卡片回调」。
    </div>
</script>

<script type="text/html" data-help-name="dingTalk-send">
    <p>通过群自定义机器人的 webhook 发送文本消息。</p>
    <h3>配置</h3>
    <ol>
        <li>群设置 → 智能群助手 → 添加自定义机器人</li>
        <li>从 webhook 地址里取 <code>access_token</code></li>
        <li>安全设置选「加签」时把 secret 也填上；选「自定义关键词」则 secret 留空</li>
    </ol>
    <h3>可选输入</h3>
    <ul>
        <li><code>msg.atMobiles</code> — 数组，@ 指定手机号</li>
        <li><code>msg.atAll</code> — <code>true</code> 时 @所有人</li>
    </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('dingTalk-send', {
        category: 'dingtalk',
        color: '#4B8BF5',
        defaults: {
            name: { value: '' },
            token: { value: '' },
            secret: { value: '' }
        },
        inputs: 1,
        outputs: 1,
        icon: 'font-awesome/fa-bell',
        label: function () {
            return this.name || '钉钉通知';
        },
        paletteLabel: '发送文本（webhook）'
    });
</script>
